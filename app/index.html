<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Gym</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #f0efeb;
  --border: #e5e4df;
  --grid: #e8e7e3;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #8a8984;
  --accent: #2a78d6;
  --accent-soft: #e3eefb;
  --on-accent: #ffffff;
  --good: #11a052;
  --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(20,20,10,.04), 0 8px 20px -12px rgba(20,20,10,.16);
  --hero-a: #2d6fe2;
  --hero-b: #7a4fe0;
  /* Un color por tipo de sesión / grupo muscular */
  --c-espalda: #2a78d6;
  --c-pecho: #e4572e;
  --c-pierna: #12a150;
  --c-full: #7b52e6;
  --c-core: #d08600;
  --c-otra: #0f96a2;
  --c-otros: #8a8984;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1b1b1a; --surface-2: #262624; --border: #30302e; --grid: #2c2c2a;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88; --accent: #3d8bea; --accent-soft: #1d2f45;
    --on-accent: #ffffff; --good: #2fb866; --critical: #ec5f5f; --shadow: none;
    --hero-a: #2356b5; --hero-b: #5a3ab2;
    --c-espalda: #4a94ec; --c-pecho: #f2754d; --c-pierna: #36b96e; --c-full: #9b7cf5; --c-core: #e8a72c; --c-otra: #2db4c0; --c-otros: #8f8e88;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1b1b1a; --surface-2: #262624; --border: #30302e; --grid: #2c2c2a;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88; --accent: #3d8bea; --accent-soft: #1d2f45;
  --on-accent: #ffffff; --good: #2fb866; --critical: #ec5f5f; --shadow: none;
  --hero-a: #2356b5; --hero-b: #5a3ab2;
  --c-espalda: #4a94ec; --c-pecho: #f2754d; --c-pierna: #36b96e; --c-full: #9b7cf5; --c-core: #e8a72c; --c-otra: #2db4c0; --c-otros: #8f8e88;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }

.top {
  position: sticky; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 8px; min-height: 52px;
}
.top .tit { flex: 1; min-width: 0; }
.top h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ceja { font-size: 13px; font-weight: 600; color: var(--muted); }
.atras { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 4px 4px 2px; margin-left: -4px; flex-basis: 100%; text-align: left; }
.top.con-atras h1 { font-size: 24px; }

main { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabs button {
  border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center;
  gap: 2px; font-size: 11px; font-weight: 500; padding: 2px 0; min-height: 48px;
}
.tabs button svg { width: 24px; height: 24px; box-sizing: content-box; padding: 3px 16px; border-radius: 999px; transition: background .2s; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabs button[aria-current="page"] svg { background: var(--accent-soft); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.pila > * + * { margin-top: 12px; }
.seccion { font-size: 13px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; margin: 24px 4px 10px; }
.sub { color: var(--text-2); font-size: 14px; }
.mut { color: var(--muted); font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 600; font-size: 16px; transition: transform .1s, opacity .15s;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.peligro { color: var(--critical); }
.btn.bloque { width: 100%; }
.btn.mini { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn.otra { background: transparent; border-style: dashed; color: var(--text-2); }
.btn:disabled { opacity: .45; }
.fila-btn { display: flex; gap: 10px; }
.fila-btn > * { flex: 1; }

.aviso { padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; color: var(--text); }
.aviso b { font-weight: 650; }
.aviso .btn { min-height: 36px; padding: 0 12px; font-size: 14px; margin-top: 8px; }

/* Piezas de color: icono, punto y etiqueta (usan --c) */
.ico {
  width: 44px; height: 44px; border-radius: 13px; flex: none; display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 72%, #fff), var(--c));
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--c) 80%, transparent);
}
.ico svg { width: 24px; height: 24px; }
.ico.sm { width: 38px; height: 38px; border-radius: 11px; }
.ico.sm svg { width: 20px; height: 20px; }
.punto { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
.tag {
  position: relative; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650;
  padding: 3px 9px 3px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 68%, var(--text));
}
.tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tag .flecha { font-size: 9px; opacity: .7; }
.tag select { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.badge {
  font-size: 11px; font-weight: 750; letter-spacing: .02em; padding: 3px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: color-mix(in srgb, var(--c) 68%, var(--text));
}

/* Inicio */
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 16px 16px 14px; color: #fff;
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  box-shadow: 0 14px 30px -16px color-mix(in srgb, var(--hero-b) 80%, transparent);
}
.hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); pointer-events: none; }
.hero::before { right: -50px; top: -70px; width: 200px; height: 200px; }
.hero::after { right: 60px; top: 40px; width: 90px; height: 90px; background: rgba(255,255,255,.05); }
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero-et { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; opacity: .85; }
.racha { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.hero-num { font-size: 42px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: 17px; font-weight: 600; letter-spacing: 0; opacity: .9; }
.hero-sub { font-size: 14px; opacity: .88; }
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
.dia { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; }
.dia > span { opacity: .75; }
.dia i {
  font-style: normal; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 600; background: rgba(255,255,255,.14); font-variant-numeric: tabular-nums;
}
.dia.fut i { background: rgba(255,255,255,.06); opacity: .55; }
.dia.hoy i { box-shadow: inset 0 0 0 2px #fff; background: rgba(255,255,255,.22); }
.dia.si i { background: #fff; color: var(--c); box-shadow: 0 4px 10px -4px rgba(0,0,0,.3); }
.dia.si.hoy i { box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.dia.si i svg { width: 18px; height: 18px; }

.tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tipo {
  position: relative; overflow: hidden; text-align: left; padding: 14px; min-height: 152px;
  display: flex; flex-direction: column; align-items: flex-start; transition: transform .12s;
}
.tipo:active { transform: scale(.97); }
.tipo::before {
  content: ''; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%;
  background: color-mix(in srgb, var(--c) 10%, transparent);
}
.tipo .ico { position: relative; margin-bottom: 12px; }
.tipo .nom { font-size: 18px; font-weight: 750; letter-spacing: -.01em; position: relative; }
.tipo .det { font-size: 13px; color: var(--text-2); position: relative; }
.tipo .cuando { margin-top: auto; padding-top: 10px; font-size: 12.5px; color: var(--muted); position: relative; }
.tipo .badge { position: absolute; top: 14px; right: 12px; }

/* Borrador */
.sesion-cab { padding: 14px 16px 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 13%, var(--surface)), var(--surface) 75%); }
.sesion-fila { display: flex; align-items: center; gap: 12px; }
.sesion-fila h2 { flex: 1; min-width: 0; font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.sesion-cab input[type=date] { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 40px; flex: none; }
.sesion-cab > .mut { margin-top: 10px; }
.barra { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, var(--surface-2)); overflow: hidden; margin-top: 14px; }
.barra > i { display: block; height: 100%; border-radius: inherit; background: var(--c); transition: width .35s ease; }
.prog-txt { display: flex; justify-content: space-between; margin-top: 6px; font-variant-numeric: tabular-nums; }
.prog-txt .ok { color: var(--good); font-weight: 650; }
.composicion { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ej { padding: 14px 14px 10px; transition: border-color .2s, background-color .2s; }
.ej.hecho { border-color: color-mix(in srgb, var(--good) 50%, var(--border)); background: color-mix(in srgb, var(--good) 5%, var(--surface)); }
.ej-cab { display: flex; gap: 10px; align-items: flex-start; }
.ej-cab .txt { flex: 1; min-width: 0; }
.ej-cab .tag { margin-bottom: 6px; }
.ej-cab h3 { font-size: 17px; font-weight: 650; }
.check {
  width: 48px; height: 48px; border-radius: 50%; flex: none; border: 2px solid var(--border);
  background: var(--surface); color: var(--muted); display: grid; place-items: center; transition: transform .15s, background-color .15s;
}
.check:active { transform: scale(.9); }
.check svg { width: 24px; height: 24px; }
.ej.hecho .check { background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 6px 14px -6px var(--good); }
.campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.campo > span { display: block; font-size: 12px; color: var(--text-2); margin: 0 0 4px 2px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); overflow: hidden; height: 44px; }
.stepper button { border: 0; background: none; width: 34px; flex: none; font-size: 22px; color: var(--accent); }
.stepper button:active { background: var(--accent-soft); }
.stepper input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; padding: 0; }
.stepper input:focus { outline: none; }
.stepper:focus-within { border-color: var(--accent); }
.ej-pie { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 36px; }
.ej-pie label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
.ej-pie input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.ej-pie .esp { flex: 1; }
.ej-pie .link { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 6px 2px; }
.nota { width: 100%; margin-top: 6px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 16px; }
.chip-pr { font-size: 12px; font-weight: 700; color: var(--good); border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; }
.barra-guardar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); margin-top: 16px; display: flex; gap: 10px; }
.barra-guardar .btn.primario { flex: 1; box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 60%, transparent); }

/* Hoja inferior */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 20; animation: aparecer .2s ease-out; }
.hoja {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface);
  border-radius: 22px 22px 0 0; max-height: 85vh; display: flex; flex-direction: column;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto;
  animation: subir .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes subir { from { transform: translateY(100%); } }
@keyframes aparecer { from { opacity: 0; } }
.hoja .asa { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 10px; flex: none; }
.hoja-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.hoja-cab h2 { flex: 1; font-size: 19px; font-weight: 750; }
.buscador { width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.buscador:focus { outline: none; border-color: var(--accent); }
.lista-sel { overflow-y: auto; margin: 10px -16px 0; padding: 0 16px; -webkit-overflow-scrolling: touch; }
.opcion { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; padding: 12px 2px; display: flex; align-items: center; gap: 12px; }
.opcion .txt { flex: 1; min-width: 0; }
.opcion b { font-weight: 600; display: block; }
.opcion .gr { font-size: 12px; color: var(--muted); flex: none; }
.opcion:disabled { opacity: .4; }
.crear-box {
  border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--border)); border-radius: 14px; padding: 12px;
  margin: 12px 0 8px; background: color-mix(in srgb, var(--accent) 4%, var(--surface));
}
.crear-box > b { color: var(--accent); display: block; margin-bottom: 10px; }
.crear-box > .mut { margin: 10px 0 6px 2px; }
.crear-box > .btn { margin-top: 12px; }
.eleccion {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 10px;
  border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
}
.eleccion:active { background: var(--surface-2); }
.eleccion .txt { flex: 1; min-width: 0; }
.eleccion b { display: block; font-weight: 650; font-size: 16px; }
.eleccion .mut { display: block; margin-top: 2px; }
.form-otra { display: flex; gap: 8px; }
.form-otra .buscador { flex: 1; min-width: 0; }

/* Progreso */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.envuelve { flex-wrap: wrap; overflow: visible; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px;
  white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; gap: 7px; flex: none;
}
.chip[style]::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.chip[style][aria-pressed="true"] {
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-color: var(--c); color: color-mix(in srgb, var(--c) 65%, var(--text));
}
.lista { overflow: hidden; }
.item { width: 100%; text-align: left; border: 0; background: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
.item:first-child { border-top: 0; }
.item .txt { flex: 1; min-width: 0; }
.item b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .der { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.delta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.delta .fl { font-size: 10px; }
.delta.sube .fl { color: var(--good); }
.delta.baja .fl { color: var(--critical); }

.det-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { padding: 12px; }
.tile .et { font-size: 12px; color: var(--text-2); }
.tile .val { font-size: 20px; font-weight: 700; margin-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 13px; font-weight: 500; color: var(--text-2); }
.tile .val.sube { color: var(--good); }
.tile .pie { font-size: 12px; color: var(--muted); margin-top: 2px; }
.segmentado { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.segmentado button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-size: 14px; font-weight: 500; color: var(--text-2); min-height: 36px; }
.segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.grafica-card { padding: 14px 10px 8px 6px; }
.grafica-card h3 { font-size: 15px; font-weight: 650; padding: 0 8px; }
.grafica-card .mut { padding: 0 8px; }
.grafica { position: relative; margin-top: 8px; }
.grafica svg { display: block; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.grafica .eje { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.grafica .fin { fill: var(--text); font-size: 12px; font-weight: 650; }
.tip {
  position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap;
}
.tip strong { display: block; font-size: 15px; }
.tip span { color: var(--text-2); }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 10px 14px 6px; }
table.hist td { padding: 9px 14px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: top; }
table.hist td:last-child, table.hist th:last-child { text-align: right; }
table.hist .n { color: var(--muted); font-size: 12px; display: block; }

/* Historial */
.seccion.mes { display: flex; justify-content: space-between; align-items: baseline; }
.seccion.mes span + span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.ses { padding: 0; overflow: hidden; margin-bottom: 10px; }
.ses-cab { width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.ses-cab .txt { flex: 1; min-width: 0; }
.ses-cab b { font-weight: 650; display: block; }
.ses-cab .mut { display: block; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; transition: transform .2s; }
.ses.abierta .chev { transform: rotate(90deg); }
.ses-cuerpo { border-top: 1px solid var(--border); padding: 6px 16px 14px; }
.ses-cuerpo ul { list-style: none; margin: 0 0 12px; padding: 0; }
.ses-cuerpo li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; font-size: 15px; border-bottom: 1px solid var(--border); }
.ses-cuerpo li > span:first-child { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.ses-cuerpo li .punto { width: 7px; height: 7px; transform: translateY(-2px); }
.ses-cuerpo li > span:last-child { color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; flex: none; }

.datos-card { padding: 16px; }
.datos-card h2 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.datos-card p + p { margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stats div { background: var(--surface-2); border-radius: 12px; padding: 10px; }
.stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--text-2); }

.vacio { text-align: center; padding: 40px 20px; color: var(--text-2); }

#toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px); text-align: center;
}
#toast.ver { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 360px) {
  .stepper button { width: 28px; }
  .tile .val { font-size: 17px; }
  .tipos { gap: 10px; }
  .tipo { padding: 12px; }
  .dia i { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top" id="cabecera"></header>
<main id="vista"></main>
<nav class="tabs" id="tabs">
  <button data-tab="entrenar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Entrenar</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg>Progreso</button>
  <button data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Historial</button>
  <button data-tab="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Datos</button>
</nav>
<div id="capa"></div>
<input type="file" id="archivo" accept=".csv,text/csv,text/plain" hidden>
<div id="toast" role="status"></div>

<script>
'use strict';

// ---------- Constantes y almacenamiento local ----------
const K = { datos: 'gym.registros.v1', borrador: 'gym.borrador.v1', meta: 'gym.meta.v1', grupos: 'gym.grupos.v1' };
const FULL = 'Full body';
// Sesiones de la pantalla de inicio. «grupo» es el grupo muscular que trabaja (null = todo el cuerpo).
const TIPOS = [
  { nombre: 'Espalda bíceps', corto: 'Espalda', detalle: 'con bíceps', grupo: 'Espalda', color: 'espalda' },
  { nombre: 'Pecho tríceps hombro', corto: 'Pecho', detalle: 'con tríceps y hombro', grupo: 'Pecho', color: 'pecho' },
  { nombre: 'Pierna', corto: 'Pierna', detalle: 'tren inferior', grupo: 'Pierna', color: 'pierna' },
  { nombre: FULL, corto: 'Full body', detalle: 'todo el cuerpo', grupo: null, color: 'full' },
];
const GRUPOS = ['Espalda', 'Pecho', 'Pierna', 'Core', 'Otros'];
const COLOR_GRUPO = { Espalda: 'espalda', Pecho: 'pecho', Pierna: 'pierna', Core: 'core', Otros: 'otros' };
// Full body sugerida: cuántos ejercicios de cada grupo
const PLAN_FULL = [['Pierna', 2], ['Pecho', 2], ['Espalda', 2], ['Core', 1]];
const COLS = ['fecha', 'sesion', 'ejercicio', 'series', 'reps', 'segundos', 'peso_kg', 'por_lado', 'notas', 'original', 'grupo'];
const PASO = { series: 1, reps: 1, segundos: 5, peso: 2.5 };
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_LARGO = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DIAS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const DIAS_LARGO = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

function leer(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; }
}
function escribir(k, v) {
  try {
    if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
    return true;
  } catch {
    toast('No se ha podido guardar en el dispositivo');
    return false;
  }
}

let registros = leer(K.datos, []);
let borrador = leer(K.borrador, null);
let meta = leer(K.meta, { exportado: null, pendientes: 0 });
let gruposManual = leer(K.grupos, {});
let cacheGrupos = null;
const ui = {
  tab: 'entrenar', ejercicio: null, metrica: 'peso', rango: 'todo', grupo: 'Todos', buscar: '', abierta: null,
  selGrupo: 'Todos', nuevoTiempo: false, nuevoGrupo: null,
};

const guardarRegistros = () => { cacheGrupos = null; return escribir(K.datos, registros); };
const guardarBorrador = () => escribir(K.borrador, borrador);
const guardarMeta = () => escribir(K.meta, meta);
const guardarGrupos = () => { cacheGrupos = null; return escribir(K.grupos, gruposManual); };

// ---------- Utilidades ----------
const clave = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => {
  if (v === '' || v == null) return null;
  const n = parseFloat(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
};
const fmt = (n, dec = 1) => n == null ? '' : n.toLocaleString('es-ES', { maximumFractionDigits: dec });
const uid = () => Math.random().toString(36).slice(2, 10);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hoy = () => iso(new Date());
const aFecha = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
const lunesDe = s => sumarDias(s, -((aFecha(s).getDay() + 6) % 7));
const fCorta = s => {
  const d = aFecha(s);
  return `${d.getDate()} ${MES[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '');
};
const hace = s => {
  const n = Math.round((aFecha(hoy()) - aFecha(s)) / 864e5);
  return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`;
};
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const esIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function descr(r) {
  const s = r.series || 1;
  let t = r.segundos != null ? `${s}×${fmt(r.segundos)} s` : r.reps != null ? `${s}×${r.reps}` : `${s} series`;
  if (r.peso_kg != null) t += ` · ${fmt(r.peso_kg)} kg${r.por_lado ? ' c/l' : ''}`;
  return t;
}
function textoOriginal(r) {
  if (r.segundos != null) return `${fmt(r.segundos)} segundos ${r.ejercicio}${r.series > 1 ? ` x ${r.series}` : ''}`;
  let t = `${r.ejercicio} ${r.series || 1}x${r.reps ?? 0}`;
  if (r.peso_kg != null) t += ` ${fmt(r.peso_kg)} kg${r.por_lado ? ' cada lado' : ''}`;
  return t;
}
// Kilos totales movidos (series × reps × kg; lo que va «cada lado» cuenta doble)
const volumen = recs => recs.reduce((s, r) => s + (r.peso_kg != null && r.reps ? (r.series || 1) * r.reps * (r.por_lado ? r.peso_kg * 2 : r.peso_kg) : 0), 0);
const fVol = v => v >= 1000 ? `${fmt(v / 1000)} t` : `${fmt(v, 0)} kg`;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('ver');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('ver'), 2600);
}
function pedirPersistencia() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

// ---------- Tipos de sesión, grupos musculares y colores ----------
const tipoDe = s => TIPOS.find(t => t.nombre === s);
const colorSesion = s => tipoDe(s)?.color || 'otra';
const colorGrupo = g => COLOR_GRUPO[g] || 'otros';
const cv = k => `--c:var(--c-${k})`;
const canonGrupo = g => GRUPOS.find(x => clave(x) === clave(g)) || null;

// Grupo de cada ejercicio: el que hayas elegido tú o, si no, el del tipo de sesión en el que más lo haces
function mapaGrupos() {
  if (cacheGrupos) return cacheGrupos;
  const cuenta = new Map();
  for (const r of registros) {
    const g = tipoDe(r.sesion)?.grupo;
    if (!g) continue;
    const c = cuenta.get(r.ejercicio) || {};
    c[g] = (c[g] || 0) + 1;
    cuenta.set(r.ejercicio, c);
  }
  const m = new Map();
  for (const [n, c] of cuenta) m.set(n, GRUPOS.filter(g => c[g]).sort((a, b) => c[b] - c[a])[0]);
  for (const [n, g] of Object.entries(gruposManual)) if (GRUPOS.includes(g)) m.set(n, g);
  return (cacheGrupos = m);
}
const grupoEj = n => mapaGrupos().get(n) || 'Otros';

const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONOS = {
  espalda: SVG('<path d="M4 5h16M12 5v4M7 9h10l-2 11H9z"/>'),
  pecho: SVG('<path d="M3 12h18M5 8v8M19 8v8M2 10v4M22 10v4"/>'),
  pierna: SVG('<path d="M9 3l1 8-3 9h4l2-7 2 7h3l-3-9 1-8"/>'),
  full: SVG('<circle cx="12" cy="4.5" r="2"/><path d="M4.5 8.5L12 10l7.5-1.5M12 10v5l-3.5 6M12 15l3.5 6"/>'),
  otra: SVG('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),
  repetir: SVG('<path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/>'),
  sugerir: SVG('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  mas: SVG('<path d="M12 5v14M5 12h14"/>'),
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const icono = (sesion, cls = '') => `<span class="ico${cls}" style="${cv(colorSesion(sesion))}" aria-hidden="true">${ICONOS[colorSesion(sesion)]}</span>`;
// Etiqueta de color con el grupo; al tocarla se puede cambiar
function tagGrupo(g, attrs) {
  return `<label class="tag" style="${cv(colorGrupo(g))}">${esc(g)}<span class="flecha" aria-hidden="true">▾</span>
    <select ${attrs} aria-label="Grupo muscular">${GRUPOS.map(x => `<option${x === g ? ' selected' : ''}>${x}</option>`).join('')}</select></label>`;
}

// ---------- Consultas sobre los datos ----------
function ordenar() {
  registros = registros.map((r, i) => [r, i]).sort((a, b) => a[0].fecha.localeCompare(b[0].fecha) || a[1] - b[1]).map(x => x[0]);
}
function porEjercicio() {
  const m = new Map();
  for (const r of registros) {
    if (!m.has(r.ejercicio)) m.set(r.ejercicio, []);
    m.get(r.ejercicio).push(r);
  }
  return m;
}
function sesiones() {
  const m = new Map();
  for (const r of registros) {
    const k = r.fecha + '|' + r.sesion;
    if (!m.has(k)) m.set(k, { clave: k, fecha: r.fecha, sesion: r.sesion, recs: [] });
    m.get(k).recs.push(r);
  }
  return [...m.values()].sort((a, b) => b.fecha.localeCompare(a.fecha));
}
const ultimaSesion = (tipo, ss = sesiones()) => ss.find(s => s.sesion === tipo);
function ultimoDe(nombre) {
  for (let i = registros.length - 1; i >= 0; i--) if (registros[i].ejercicio === nombre) return registros[i];
  return null;
}
// Cómo se mide un ejercicio y en qué unidad se compara el peso
function perfil(recs) {
  const conPeso = recs.filter(r => r.peso_kg != null);
  const tipo = conPeso.length ? 'peso' : recs.some(r => r.segundos != null) ? 'tiempo' : 'reps';
  const lado = conPeso.filter(r => r.por_lado).length * 2 > conPeso.length;
  return { tipo, lado, ud: tipo === 'peso' ? (lado ? 'kg c/l' : 'kg') : tipo === 'tiempo' ? 's' : 'reps' };
}
function carga(r, lado) {
  if (r.peso_kg == null) return null;
  if (lado === !!r.por_lado) return r.peso_kg;
  return lado ? r.peso_kg / 2 : r.peso_kg * 2;
}
function valor(r, metrica, p) {
  if (p.tipo === 'tiempo') return r.segundos;
  if (p.tipo === 'reps') return (r.series || 1) * (r.reps || 0);
  const c = carga(r, p.lado);
  if (c == null) return null;
  if (metrica === '1rm') return r.reps ? c * (1 + r.reps / 30) : c;
  if (metrica === 'volumen') return (r.series || 1) * (r.reps || 0) * (r.por_lado ? r.peso_kg * 2 : r.peso_kg);
  return c;
}
// Un punto por fecha (el mejor valor del día)
function serie(recs, metrica, p) {
  const m = new Map();
  for (const r of recs) {
    const v = valor(r, metrica, p);
    if (v == null) continue;
    const prev = m.get(r.fecha);
    if (!prev || v > prev.v) m.set(r.fecha, { fecha: r.fecha, v, r });
  }
  return [...m.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
}

// ---------- Render general ----------
const $vista = document.getElementById('vista');
const $cab = document.getElementById('cabecera');
const $capa = document.getElementById('capa');

function render() {
  for (const b of document.querySelectorAll('#tabs button')) {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
  if (ui.tab === 'entrenar') borrador ? vistaBorrador() : vistaInicio();
  else if (ui.tab === 'progreso') ui.ejercicio ? vistaDetalle() : vistaProgreso();
  else if (ui.tab === 'historial') vistaHistorial();
  else vistaDatos();
}
function cabecera(titulo, atras, ceja) {
  $cab.classList.toggle('con-atras', !!atras);
  $cab.innerHTML = (atras ? `<button class="atras" data-action="${atras.accion}">‹ ${esc(atras.texto)}</button>` : '')
    + `<div class="tit">${ceja ? `<p class="ceja">${esc(ceja)}</p>` : ''}<h1>${esc(titulo)}</h1></div>`;
}
function avisoInstalar() {
  if (!esIOS || instalada()) return '';
  return `<div class="aviso"><b>Instálala primero.</b> En Safari pulsa Compartir → «Añadir a pantalla de inicio» y ábrela desde el icono. Safari y la app instalada guardan los datos por separado, así que importa tu CSV ya desde la app.</div>`;
}
function abrirHoja(titulo, cuerpo) {
  $capa.innerHTML = `<div class="velo" data-action="cerrar-hoja"></div>
    <div class="hoja" role="dialog" aria-label="${esc(titulo)}"><div class="asa"></div>
    <div class="hoja-cab"><h2>${esc(titulo)}</h2><button class="btn mini" data-action="cerrar-hoja">Cerrar</button></div>${cuerpo}</div>`;
}

// ---------- Entrenar: inicio ----------
function vistaInicio() {
  const f = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  cabecera('Entrenar', null, f.charAt(0).toUpperCase() + f.slice(1));
  const ss = sesiones();
  let h = '<div class="pila">';
  h += avisoInstalar();
  if (!registros.length) {
    h += `<div class="aviso"><b>Aún no hay datos.</b> Importa tu <i>entrenos.csv</i> para que cada sesión empiece con lo que hiciste la última vez.<br><button class="btn" data-action="ir" data-tab="datos">Ir a Datos</button></div>`;
  } else {
    h += heroHTML(ss);
    if (meta.pendientes > 0) {
      h += `<div class="aviso"><b>${meta.pendientes} ${meta.pendientes === 1 ? 'sesión' : 'sesiones'} sin copia de seguridad.</b> Exporta el CSV de vez en cuando para no perder nada si se borran los datos del móvil.<br><button class="btn" data-action="exportar">Exportar CSV</button></div>`;
    }
  }
  h += '</div><h2 class="seccion">Nueva sesión</h2><div class="tipos">';
  const toca = tocaHoy(ss);
  for (const t of TIPOS) {
    const u = ultimaSesion(t.nombre, ss);
    const cuando = u ? `${hace(u.fecha)} · ${plural(u.recs.length, 'ejercicio', 'ejercicios')}` : 'Sin sesiones todavía';
    h += `<button class="card tipo" style="${cv(t.color)}" data-action="empezar" data-tipo="${esc(t.nombre)}">
      ${toca === t.nombre ? '<span class="badge">Te toca</span>' : ''}
      <span class="ico">${ICONOS[t.color]}</span>
      <span class="nom">${esc(t.corto)}</span><span class="det">${esc(t.detalle)}</span>
      <span class="cuando">${esc(cuando)}</span></button>`;
  }
  h += `</div><button class="btn bloque otra" data-action="empezar-otra" style="margin-top:12px">+ Otra sesión…</button>`;
  $vista.innerHTML = h;
}

function heroHTML(ss) {
  const t = hoy(), lunes = lunesDe(t), domingo = sumarDias(lunes, 6), lunesAnt = sumarDias(lunes, -7);
  const semana = ss.filter(s => s.fecha >= lunes && s.fecha <= domingo);
  const anterior = ss.filter(s => s.fecha >= lunesAnt && s.fecha < lunes).length;
  const porDia = new Map();
  for (const s of [...semana].reverse()) porDia.set(s.fecha, [...(porDia.get(s.fecha) || []), s.sesion]);
  const recs = semana.flatMap(s => s.recs);
  const vol = volumen(recs);
  const partes = semana.length ? [plural(recs.length, 'ejercicio', 'ejercicios')] : ['Aún no has entrenado esta semana'];
  if (vol) partes.push(fVol(vol));
  partes.push(`semana pasada: ${anterior}`);
  const r = racha(ss);
  let dias = '';
  for (let i = 0; i < 7; i++) {
    const f = sumarDias(lunes, i), tipos = porDia.get(f) || [];
    const cls = [tipos.length && 'si', f === t && 'hoy', f > t && 'fut'].filter(Boolean).join(' ');
    const et = `${DIAS_LARGO[i]} ${aFecha(f).getDate()}${tipos.length ? ': ' + tipos.join(', ') : ''}`;
    dias += `<div class="dia ${cls}" title="${esc(et)}"><span>${DIAS[i]}</span><i${tipos.length ? ` style="${cv(colorSesion(tipos[0]))}"` : ''}>${tipos.length ? CHECK : aFecha(f).getDate()}</i></div>`;
  }
  return `<section class="hero"><div class="hero-top"><span class="hero-et">Esta semana</span>${r >= 2 ? `<span class="racha">🔥 ${r} semanas seguidas</span>` : ''}</div>
    <p class="hero-num">${semana.length}<small> ${semana.length === 1 ? 'sesión' : 'sesiones'}</small></p>
    <p class="hero-sub">${esc(partes.join(' · '))}</p><div class="dias">${dias}</div></section>`;
}
// Semanas seguidas (hasta esta o la anterior) con al menos una sesión
function racha(ss) {
  const sem = new Set(ss.map(s => lunesDe(s.fecha)));
  let l = lunesDe(hoy());
  if (!sem.has(l)) l = sumarDias(l, -7);
  let n = 0;
  while (sem.has(l)) { n++; l = sumarDias(l, -7); }
  return n;
}
// Si estás rotando varios tipos (últimas 3 semanas), el que hace más que no haces
function tocaHoy(ss) {
  const lim = sumarDias(hoy(), -21);
  const rec = TIPOS.map(t => [t.nombre, ultimaSesion(t.nombre, ss)]).filter(([, u]) => u && u.fecha >= lim);
  if (rec.length < 2) return null;
  rec.sort((a, b) => a[1].fecha.localeCompare(b[1].fecha));
  return rec[0][1].fecha === hoy() ? null : rec[0][0];
}

// Full body: tus ejercicios más habituales de cada grupo, evitando si se puede los de la última
function sugerirFull(ultima) {
  const lim = sumarDias(hoy(), -120);
  const evitar = new Set(ultima ? ultima.recs.map(r => r.ejercicio) : []);
  const cand = new Map();
  for (const [n, recs] of porEjercicio()) {
    const g = grupoEj(n);
    if (!cand.has(g)) cand.set(g, []);
    const dias = new Set(recs.map(r => r.fecha));
    cand.get(g).push({ n, rec: [...dias].filter(f => f >= lim).length, tot: dias.size });
  }
  const out = [];
  for (const [g, k] of PLAN_FULL) {
    const l = (cand.get(g) || []).sort((a, b) => b.rec - a.rec || b.tot - a.tot);
    out.push(...[...l.filter(c => !evitar.has(c.n)), ...l.filter(c => evitar.has(c.n))].slice(0, k).map(c => c.n));
  }
  return out;
}

// ---------- Progreso ----------
function deltaHTML(p, pts) {
  if (pts.length < 2) return '';
  const d = pts[pts.length - 1].v - pts[0].v;
  const cls = d > 0 ? 'sube' : d < 0 ? 'baja' : '';
  const fl = d > 0 ? '▲' : d < 0 ? '▼' : '';
  return `<span class="delta ${cls}"><span class="fl">${fl}</span> ${d > 0 ? '+' : ''}${fmt(d)} ${p.ud}</span>`;
}
function sparkline(pts) {
  if (pts.length < 2) return '';
  const w = 72, h = 24, vs = pts.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs), r = max - min || 1;
  const t0 = aFecha(pts[0].fecha), t1 = aFecha(pts[pts.length - 1].fecha), tr = (t1 - t0) || 1;
  const xy = pts.map(p => [2 + (aFecha(p.fecha) - t0) / tr * (w - 6), h - 3 - (p.v - min) / r * (h - 6)]);
  const [lx, ly] = xy[xy.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${xy.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--c, var(--accent))"/></svg>`;
}

function nice(span, n) {
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
function lineChart(el, pts, o) {
  const W = Math.max(260, el.clientWidth), H = 220;
  const m = { t: 14, r: 46, b: 26, l: 40 };
  const col = 'var(--c, var(--accent))';
  const ts = pts.map(x => aFecha(x.fecha).getTime());
  let t0 = ts[0], t1 = ts[ts.length - 1];
  if (t0 === t1) { t0 -= 7 * 864e5; t1 += 7 * 864e5; }
  const vs = pts.map(x => x.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo -= Math.max(1, lo * 0.1); hi += Math.max(1, hi * 0.1); }
  const step = nice(hi - lo, 4);
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Gráfica de progreso">
    <defs><linearGradient id="relleno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.22"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs>`;
  for (let v = lo; v <= hi + step / 2; v += step) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="eje" x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, step < 1 ? 1 : 0)}</text>`;
  }
  // Meses en el eje X
  const d = new Date(t0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  const meses = [];
  for (; d.getTime() <= t1; d.setMonth(d.getMonth() + 1)) meses.push(d.getTime());
  const cada = Math.ceil(meses.length / Math.max(1, Math.floor((W - m.l - m.r) / 44)));
  meses.forEach((t, i) => {
    if (i % cada) return;
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--grid)"/>`;
    s += `<text class="eje" x="${X(t)}" y="${H - 8}" text-anchor="middle">${MES[new Date(t).getMonth()]}</text>`;
  });
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--grid)"/>`;
  const xy = pts.map((x, i) => [X(ts[i]), Y(x.v)]);
  if (xy.length > 1) s += `<path d="M${xy[0][0]},${H - m.b} ${xy.map(q => 'L' + q.join(',')).join(' ')} L${xy[xy.length - 1][0]},${H - m.b}Z" fill="url(#relleno)"/>`;
  s += `<polyline points="${xy.map(q => q.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<line id="cruz" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  s += xy.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  s += `<circle id="foco" r="6" fill="${col}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  const [lx, ly] = xy[xy.length - 1];
  s += `<text class="fin" x="${lx + 8}" y="${ly + 4}">${fmt(pts[pts.length - 1].v, o.dec)}</text>`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="zona"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;

  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const cruz = svg.querySelector('#cruz'), foco = svg.querySelector('#foco');
  function mostrar(ev) {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    let i = 0;
    for (let k = 1; k < xy.length; k++) if (Math.abs(xy[k][0] - px) < Math.abs(xy[i][0] - px)) i = k;
    const [x, y] = xy[i];
    cruz.setAttribute('x1', x); cruz.setAttribute('x2', x); cruz.setAttribute('visibility', 'visible');
    foco.setAttribute('cx', x); foco.setAttribute('cy', y); foco.setAttribute('visibility', 'visible');
    tip.replaceChildren();
    const st = document.createElement('strong');
    st.textContent = `${fmt(pts[i].v, o.dec)} ${o.ud}`;
    const sp = document.createElement('span');
    sp.textContent = `${fCorta(pts[i].fecha)} · ${o.desc(pts[i])}`;
    tip.append(st, sp);
    tip.hidden = false;
    // Al lado del punto (no encima) para no tapar la línea
    const sx = x * (r.width / W), sy = y * (r.height / H), tw = tip.offsetWidth, th = tip.offsetHeight;
    const izq = sx > r.width / 2 ? sx - tw - 12 : sx + 12;
    tip.style.left = Math.min(Math.max(0, izq), r.width - tw) + 'px';
    tip.style.top = Math.min(Math.max(0, sy - th / 2), r.height - th - 28) + 'px';
  }
  function ocultar() {
    tip.hidden = true;
    cruz.setAttribute('visibility', 'hidden');
    foco.setAttribute('visibility', 'hidden');
  }
  svg.addEventListener('pointermove', mostrar);
  svg.addEventListener('pointerdown', mostrar);
  svg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') ocultar(); });
  svg.addEventListener('pointercancel', ocultar);
}

// ---------- Datos: exportar / importar ----------
function aCSV() {
  const celda = v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const filas = registros.map(r => COLS.map(c => celda(c === 'por_lado' ? (r.por_lado ? 'sí' : '') : c === 'grupo' ? grupoEj(r.ejercicio) : r[c])).join(','));
  return [COLS.join(','), ...filas].join('\r\n') + '\r\n';
}
async function exportar() {
  if (!registros.length) return toast('No hay datos que exportar');
  const nombre = `entrenos-${hoy()}.csv`;
  const archivo = new File([aCSV()], nombre, { type: 'text/csv' });
  const hecho = () => { meta = { exportado: hoy(), pendientes: 0 }; guardarMeta(); render(); toast('Copia exportada'); };
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: nombre }); hecho(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(archivo);
  a.download = nombre;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  hecho();
}
function parseCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const filas = [];
  let fila = [], campo = '', q = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (q) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') q = false;
      else campo += c;
    } else if (c === '"') q = true;
    else if (c === ',') { fila.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      fila.push(campo); filas.push(fila); fila = []; campo = '';
    } else campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas.filter(f => f.some(x => x.trim()));
}
function deCSV(texto) {
  const filas = parseCSV(texto);
  if (!filas.length) throw new Error('El archivo está vacío');
  const cab = filas[0].map(h => clave(h));
  const idx = Object.fromEntries(COLS.map(c => [c, cab.indexOf(c)]));
  if (idx.fecha < 0 || idx.ejercicio < 0) throw new Error('Faltan las columnas «fecha» y «ejercicio»');
  const out = [], grupos = {};
  let malas = 0;
  for (const f of filas.slice(1)) {
    const g = c => idx[c] >= 0 ? (f[idx[c]] ?? '').trim() : '';
    const fecha = g('fecha');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha) || !g('ejercicio')) { malas++; continue; }
    out.push({
      fecha, sesion: g('sesion') || 'Sin tipo', ejercicio: g('ejercicio'),
      series: num(g('series')), reps: num(g('reps')), segundos: num(g('segundos')), peso_kg: num(g('peso_kg')),
      por_lado: ['si', 'true', '1', 'x'].includes(clave(g('por_lado'))),
      notas: g('notas'), original: g('original'),
    });
    const gr = canonGrupo(g('grupo'));
    if (gr) grupos[g('ejercicio')] = gr;
  }
  return { out, malas, grupos };
}
const firma = r => [r.fecha, r.sesion, r.ejercicio, r.series, r.reps, r.segundos, r.peso_kg, r.por_lado ? 1 : 0].join('|');
let modoImport = 'reemplazar';
async function importar(file) {
  try {
    const { out, malas, grupos } = deCSV(await file.text());
    if (!out.length) throw new Error('No se ha encontrado ninguna fila válida');
    if (modoImport === 'reemplazar') {
      if (registros.length && !confirm(`Esto sustituye tus ${registros.length} registros actuales por los ${out.length} del archivo. ¿Continuar?`)) return;
      registros = out;
    } else {
      const ya = new Set(registros.map(firma));
      const nuevos = out.filter(r => !ya.has(firma(r)));
      registros = registros.concat(nuevos);
      toast(`${nuevos.length} registros nuevos añadidos`);
    }
    ordenar();
    if (!guardarRegistros()) return;
    Object.assign(gruposManual, grupos);
    guardarGrupos();
    meta.pendientes = 0;
    guardarMeta();
    pedirPersistencia();
    render();
    if (modoImport === 'reemplazar') toast(`${out.length} registros importados` + (malas ? ` · ${malas} filas ignoradas` : ''));
  } catch (e) {
    alert('No se ha podido importar: ' + e.message);
  }
}

      break;

      const k = b.dataset.clave;
      const [f, s] = k.split('|');
      if (!confirm(`¿Borrar la sesión de ${s} del ${fCorta(f)}?`)) return;
      registros = registros.filter(r => r.fecha + '|' + r.sesion !== k);
      guardarRegistros();
      ui.abierta = null;
      vistaHistorial();
      toast('Sesión borrada');
      break;
    }
    case 'exportar': exportar(); break;
    case 'importar': modoImport = b.dataset.modo; document.getElementById('archivo').click(); break;
    case 'borrar-todo':
      if (!confirm('¿Borrar TODOS tus entrenamientos de este dispositivo?')) return;
      if (!confirm('Esto no se puede deshacer. ¿Seguro?')) return;
      registros = []; borrador = null; meta = { exportado: null, pendientes: 0 }; gruposManual = {};
      guardarRegistros(); guardarBorrador(); guardarMeta(); guardarGrupos(); render();
      break;
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'form-otra') return;
  e.preventDefault();
  const n = document.getElementById('nombre-otra').value.trim().replace(/\s+/g, ' ');
  if (!n) return;
  // Si ya existe una sesión con ese nombre (sin mirar tildes ni mayúsculas), usar el mismo
  const existente = [...TIPOS.map(t => t.nombre), ...sesiones().map(s => s.sesion)].find(x => clave(x) === clave(n));
  $capa.innerHTML = '';
  if (existente === FULL) pulsarFull();
  else empezar(existente || n.charAt(0).toUpperCase() + n.slice(1));
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'buscar-ej') return listaSelector();
  if (t.id === 'buscar-prog') { ui.buscar = t.value; return listaProgreso(); }
  if (t.id === 'grupo-det') { gruposManual[ui.ejercicio] = t.value; guardarGrupos(); return vistaDetalle(); }
  const c = t.dataset.campo;
  if (!c || !borrador) return;
  if (c === 'fecha') { if (t.value) borrador.fecha = t.value; guardarBorrador(); return; }
  const [card, it] = itemDe(t);
  if (!it) return;
  if (c === 'grupo') { gruposManual[it.ejercicio] = t.value; guardarGrupos(); return vistaBorrador(); }
  if (c === 'lado') it.lado = t.checked;
  else if (c === 'notas') it.notas = t.value;
  else it[c] = num(t.value);
  guardarBorrador();
  refrescarRecord(card, it);
});
// Al tocar un número, seleccionarlo entero para sobrescribirlo directamente
document.addEventListener('focusin', e => {
  if (e.target.matches('.stepper input')) setTimeout(() => e.target.select(), 0);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.stepper input')) e.target.blur();
  if (e.key === 'Escape' && $capa.innerHTML) $capa.innerHTML = '';
});
document.getElementById('archivo').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) importar(f);
});
let anchoPrevio = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === anchoPrevio) return;
  anchoPrevio = innerWidth;
  if (ui.tab === 'progreso' && ui.ejercicio) dibujarGrafica();
});

if (borrador) ui.tab = 'entrenar';
render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
